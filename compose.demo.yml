name: nexora-ai-demo

services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: nexora_ai_demo
      POSTGRES_USER: nexora_demo
      POSTGRES_PASSWORD: nexora-local-only
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora_demo -d nexora_ai_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tika:
    image: apache/tika:3.3.3.0
    restart: unless-stopped

  schema:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      DATABASE_URL: postgresql://nexora_demo:nexora-local-only@database:5432/nexora_ai_demo
    command:
      - python
      - -m
      - src.ingestion.cli
      - --bootstrap-db
      - --confirm-db-name
      - nexora_ai_demo
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      DATABASE_URL: postgresql://nexora_demo:nexora-local-only@database:5432/nexora_ai_demo
      TIKA_SERVER_ENDPOINT: http://tika:9998
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY in .env}
      AI_UPLOAD_DIRECTORY: /var/lib/nexora/uploads
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - demo_uploads:/var/lib/nexora/uploads
      - type: bind
        source: ${HF_CACHE_PATH:-./.local/huggingface/hub}
        target: /models/huggingface/hub
    ports:
      - "127.0.0.1:${AI_API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      tika:
        condition: service_started
      schema:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  demo_postgres:
    name: nexora_ai_demo_postgres
  demo_uploads:
    name: nexora_ai_demo_uploads
