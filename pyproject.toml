[project]
name = "nexora-ai"
version = "0.1.0"
description = "Nexora AI API and BullMQ worker foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bullmq>=3.4,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "redis>=5,<9",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that connect to external services"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
